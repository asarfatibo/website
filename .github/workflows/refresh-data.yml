name: Daily data refresh

on:
  schedule:
    - cron: "0 8 * * *" # Every day at 8:00 UTC
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/refresh-data.mjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      # Pulls the latest @bubbleout.irl posts + thumbnails so the home Instagram
      # section stays current. Needs a long-lived token in the META_API_TOKEN
      # secret; without it the script keeps the committed posts and exits 0.
      - run: node scripts/fetch-instagram.mjs
        env:
          META_API_TOKEN: ${{ secrets.META_API_TOKEN }}

      - name: Commit and push if changed
        run: |
          git add lib/live-data.json lib/instagram-posts.json public/instagram
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily data refresh"
          git push
